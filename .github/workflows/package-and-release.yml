name: Build Catalogue & Publish Release

on:
  push:
    branches: [ main ]
    paths:
      - 'adventures/**'
      - 'kits/**'
      - 'catalogue/**'
      - 'heroes/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # Binaries are in Git LFS: fetch them through a cache, so a run downloads only objects it hasn't seen.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      # Packs, content-named archives (only new ones are built) and the catalogue for Pages (D147).
      - name: Build catalogue
        run: |
          python3 scripts/build-distribution.py
        env:
          RELEASE_TAG: v1.0.${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest and documentation [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Spatial GM Catalogue v1.0.${{ github.run_number }}"
          body: |
            Archives new in this catalogue (LZFSE Apple Archives of files named by their SHA-256).
            The app reads https://dylanbeadle.github.io/adventures/manifest.json and downloads only
            the archives holding files it doesn't have; archives from earlier releases keep their URLs.
          files: |
            dist/release/*.aar
            docs/manifest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
