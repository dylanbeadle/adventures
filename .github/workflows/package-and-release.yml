name: Package Campaigns & Publish Release

on:
  push:
    branches: [ main ]
    paths:
      - 'campaigns/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build campaign archives and documentation
        run: |
          python3 scripts/build-distribution.py
        env:
          RELEASE_TAG: v1.0.${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest and documentation [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Spatial GM Campaigns v1.0.${{ github.run_number }}"
          body: |
            Automated campaign package release for Spatial GM.
            
            Downloadable `.spatialgm.aar` packages compiled with Apple Archive (LZFSE).
          files: |
            dist/*.aar
            docs/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
